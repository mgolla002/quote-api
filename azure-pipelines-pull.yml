trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-vars
  - name: appName
    value: quote-api

steps:
- script: |
    curl -fL https://install-cli.jfrog.io | sh
    jf config add trial --url=https://$(JFROG_URL) --user=$(JFROG_USER) --access-token=$(JFROG_TOKEN) --interactive=false
  displayName: Install and configure JFrog CLI

- script: |
    jf rt download "pypl-local/$(appName)/*.whl" downloaded/ --flat=true
    ls -l downloaded/
  displayName: PULL wheel with jf

- script: |
    echo "$(JFROG_TOKEN)" | docker login $(JFROG_URL) -u $(JFROG_USER) --password-stdin
    docker pull $(JFROG_URL)/docker-trial/$(appName):20
    docker run -d -p 8000:8000 --name qa $(JFROG_URL)/docker-trial/$(appName):20
    sleep 8
    curl http://localhost:8000/quote
  displayName: PULL image and run it