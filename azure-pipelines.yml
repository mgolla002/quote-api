trigger:
  branches:
    include: [ main ]

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-vars
  - name: appName
    value: quote-api

stages:
- stage: Build
  jobs:
  - job: BuildTest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt build
      displayName: Install dependencies
    - script: pytest -q
      displayName: Run tests
    - script: python -m build
      displayName: Build wheel
    - publish: dist
      artifact: python-dist

- stage: PushToJFrog
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Push
    steps:
    - download: current
      artifact: python-dist

    - script: |
        curl -fL https://install-cli.jfrog.io | sh
        jf --version
        jf config add trial --url=https://$(JFROG_URL) --user=$(JFROG_USER) --access-token=$(JFROG_TOKEN) --interactive=false
        jf rt ping
      displayName: Install and configure JFrog CLI

    - script: |
        jf rt upload "$(Pipeline.Workspace)/python-dist/*.whl" pypl-local/$(appName)/ \
          --flat=true --build-name=$(appName) --build-number=$(Build.BuildId)
      displayName: PUSH wheel with jf

    - script: |
        docker build -t $(JFROG_URL)/docker-trial/$(appName):$(Build.BuildId) .
        docker push $(JFROG_URL)/docker-trial/$(appName):$(Build.BuildId)
      displayName: PUSH image

    - script: |
        jf rt build-collect-env $(appName) $(Build.BuildId)
        jf rt build-publish $(appName) $(Build.BuildId)
      displayName: Publish build info